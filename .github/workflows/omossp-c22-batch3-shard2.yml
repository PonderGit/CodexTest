name: OMOSSP C22 Batch3 Shard2 production
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c22-batch3-shard2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: FREE-ONLY hard gate
        shell: bash
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          test "$REPO_VISIBILITY" = "public" || exit 96
          echo "FREE_ONLY_GATE=PASS__PUBLIC_REPO__STANDARD_UBUNTU_RUNNER__NO_ARTIFACT_CACHE"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run C22 authorized Batch3 Shard2
        env:
          OMOSSP_BATCH_FILE: production_batches/omossp_c18_batch3.json
          OMOSSP_SHARD: "2"
        run: python omossp_c22_production_worker.py
      - name: Emit replayable Batch3 Shard2 result
        shell: bash
        run: |
          echo "===== OMOSSP_C22_CANONICAL_SHA256 ====="
          cat "omossp_c22_output/c22_batch3_shard2.sha256"
          echo "===== OMOSSP_C22_JSON_BEGIN ====="
          cat "omossp_c22_output/c22_batch3_shard2.json"
          echo "===== OMOSSP_C22_JSON_END ====="
