name: AEF Corrected Sample Multi-Year Metadata R1

on:
  push:
    paths:
      - '.github/workflows/aef-corrected-sample-metadata-r1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GH_TOKEN: ${{ github.token }}
      STAGE1_RUN_ID: "36326091348"
      STAGE1_ARTIFACT: "aef-sec-fullframe-sic-r1-36326091348"
    steps:
      - name: Validate
        shell: bash
        run: |
          test -n "$SEC_USER_AGENT" || { echo "SEC_USER_AGENT missing" >&2; exit 2; }

      - name: Download Stage 1 map
        shell: bash
        run: |
          mkdir -p stage1_in
          gh run download "$STAGE1_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$STAGE1_ARTIFACT" --dir stage1_in
          test -f stage1_in/SEC_2018_Exact10K_Frame_SIC_Map_R1.csv

      - name: Build corrected sample and acquire 2019-2025 metadata
        shell: python
        run: |
          import csv, hashlib, json, os, pathlib, random, time, urllib.request
          from collections import Counter
          from datetime import datetime, timezone

          SEED=20260925
          SAMPLE_N=150
          EXPECTED_SAMPLE_CIK_HASH='12bd8611e57f9f4e27d0b8eb9adb758d6854841f62f321e24b79295aa846ee78'
          ua=os.environ['SEC_USER_AGENT'].strip()
          inp=pathlib.Path('stage1_in/SEC_2018_Exact10K_Frame_SIC_Map_R1.csv')
          out=pathlib.Path('aef_stage4_metadata'); out.mkdir(exist_ok=True)

          frame=list(csv.DictReader(inp.open(encoding='utf-8')))
          eligible=sorted([r for r in frame if (r.get('sic') or '').strip()!='6189'], key=lambda r:r['cik'])
          assert len(frame)==6907
          assert len(eligible)==6255
          rng=random.Random(SEED)
          selected=set(rng.sample([r['cik'] for r in eligible],SAMPLE_N))
          sample=[r for r in eligible if r['cik'] in selected]
          sample=sorted(sample,key=lambda r:r['cik'])
          assert len(sample)==150
          sample_hash=hashlib.sha256(('\n'.join(r['cik'] for r in sample)+'\n').encode()).hexdigest()
          assert sample_hash==EXPECTED_SAMPLE_CIK_HASH, (sample_hash,EXPECTED_SAMPLE_CIK_HASH)
          assert all((r.get('sic') or '').strip()!='6189' for r in sample)

          def get_json(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept-Encoding':'identity'})
              with urllib.request.urlopen(req,timeout=60) as resp:
                  return json.loads(resp.read().decode('utf-8'))

          rows=[]
          source_files=[]
          for r in sample:
              cik=r['cik']
              url=f'https://data.sec.gov/submissions/CIK{cik}.json'
              obj=get_json(url)
              source_files.append(url)
              blocks=[obj.get('filings',{}).get('recent',{})]
              for extra in obj.get('filings',{}).get('files',[]) or []:
                  name=extra.get('name')
                  if not name: continue
                  ex_url='https://data.sec.gov/submissions/'+name
                  blocks.append(get_json(ex_url)); source_files.append(ex_url)
                  time.sleep(0.06)
              for b in blocks:
                  forms=b.get('form',[]) or []
                  n=len(forms)
                  for i in range(n):
                      form=forms[i]
                      fd=(b.get('filingDate') or ['']*n)[i]
                      if not ('2019-01-01' <= fd <= '2025-12-31'): continue
                      if form not in {'10-K','10-K/A','10-Q','10-Q/A'}: continue
                      rows.append({
                          'cik':cik,
                          'sample_company_name':r.get('company_name',''),
                          'sample_sic':r.get('sic',''),
                          'form':form,
                          'filing_date':fd,
                          'report_date':(b.get('reportDate') or ['']*n)[i],
                          'accession':(b.get('accessionNumber') or ['']*n)[i],
                          'primary_document':(b.get('primaryDocument') or ['']*n)[i],
                          'primary_doc_description':(b.get('primaryDocDescription') or ['']*n)[i],
                      })
              time.sleep(0.10)

          # Deduplicate by CIK + accession + form.
          seen=set(); dedup=[]
          for x in sorted(rows,key=lambda z:(z['cik'],z['filing_date'],z['accession'],z['form'])):
              k=(x['cik'],x['accession'],x['form'])
              if k in seen: continue
              seen.add(k); dedup.append(x)
          rows=dedup

          csv_path=out/'SEC_150_CORRECTED_MultiYear_Filing_Metadata_2019_2025_R1.csv'
          fields=['cik','sample_company_name','sample_sic','form','filing_date','report_date','accession','primary_document','primary_doc_description']
          with csv_path.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)

          sample_path=out/'SEC_150_CORRECTED_Sample_CIKs_R1.csv'
          with sample_path.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=list(sample[0].keys())); w.writeheader(); w.writerows(sample)

          exact=[x for x in rows if x['form'] in {'10-K','10-Q'}]
          years=Counter(x['filing_date'][:4] for x in exact)
          forms=Counter(x['form'] for x in rows)
          issuers_exact=len({x['cik'] for x in exact})
          summary={
              'stage':'S4_CORRECTED_SAMPLE_MULTIYEAR_METADATA',
              'retrieved_at_utc':datetime.now(timezone.utc).isoformat(),
              'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
              'sample_seed':SEED,
              'sample_n':len(sample),
              'sample_cik_hash':sample_hash,
              'sample_sic6189_n':sum((r.get('sic') or '')=='6189' for r in sample),
              'sample_current_sic_missing_n':sum(not (r.get('sic') or '').strip() for r in sample),
              'metadata_rows_four_forms':len(rows),
              'form_counts':dict(sorted(forms.items())),
              'exact_primary_rows':len(exact),
              'exact_primary_issuers':issuers_exact,
              'year_counts_exact':dict(sorted(years.items())),
              'unique_accession_form_keys':len(seen),
              'duplicate_rows_removed':len(dedup)-len(rows),
              'source_file_requests_n':len(source_files),
              'metadata_csv_sha256':hashlib.sha256(csv_path.read_bytes()).hexdigest(),
              'sample_csv_sha256':hashlib.sha256(sample_path.read_bytes()).hexdigest(),
          }
          (out/'SEC_150_CORRECTED_MultiYear_Metadata_Summary_R1.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))

      - name: Upload Stage 4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aef-corrected-sample-metadata-r1-${{ github.run_id }}
          path: aef_stage4_metadata/
          if-no-files-found: error
          retention-days: 5
          compression-level: 6

      - name: Publish restartable Stage 4 status
        if: always()
        shell: python
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          import base64,json,os,pathlib,urllib.request,urllib.error
          repo=os.environ['GITHUB_REPOSITORY']; run_id=os.environ['GITHUB_RUN_ID']
          p=pathlib.Path('aef_stage4_metadata/SEC_150_CORRECTED_MultiYear_Metadata_Summary_R1.json')
          summary=json.loads(p.read_text()) if p.exists() else None
          obj={'workflow':'AEF Corrected Sample Multi-Year Metadata R1','run_id':run_id,'job_status':os.environ.get('JOB_STATUS'),'trigger_commit_sha':os.environ.get('GITHUB_SHA'),'artifact_name':f'aef-corrected-sample-metadata-r1-{run_id}','summary':summary}
          raw=(json.dumps(obj,indent=2)+'\n').encode()
          api=f'https://api.github.com/repos/{repo}/contents/aef_stage4/latest_run.json'
          headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'AEF-stage4-status'}
          sha=None
          try:
              with urllib.request.urlopen(urllib.request.Request(api,headers=headers),timeout=30) as rr: sha=json.loads(rr.read().decode()).get('sha')
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
          body={'message':f'AEF Stage 4 status for run {run_id}','content':base64.b64encode(raw).decode()}
          if sha: body['sha']=sha
          req=urllib.request.Request(api,data=json.dumps(body).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req,timeout=30) as rr: print(rr.status)
