name: OMOSSP R6B Formal Python Robustness

on:
  workflow_dispatch:
  push:
    paths:
      - "analysis/r6b_python_formal_robustness_r1.py"
      - "governance/omossp_r6b_formal_execution_lock_r1.json"
      - ".github/workflows/omossp-r6b-python-formal.yml"

permissions:
  contents: write

jobs:
  r6b_python_formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: FREE-ONLY gate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository_visibility }}" = "public"
          echo "FREE_ONLY_GATE=PASS__PUBLIC_REPO__STANDARD_GITHUB_HOSTED_RUNNER"

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "pandas==2.2.3" \
            "linearmodels==6.1" \
            "numpy==2.5.3" \
            "scipy==1.18.1" \
            "statsmodels==0.15.0"

      - name: Run all frozen R6B specifications
        shell: bash
        run: |
          set -euo pipefail
          python analysis/r6b_python_formal_robustness_r1.py
          python -m pip freeze > results/r6b_python_formal/r6b_python_formal_pip_freeze.txt

      - name: Commit frozen R6B Python outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/r6b_python_formal/r6b_python_formal_summary.json
          git add results/r6b_python_formal/r6b_python_formal_coefficients.csv
          git add results/r6b_python_formal/r6b_python_comparison_to_r5.csv
          git add results/r6b_python_formal/r6b_python_formal_environment.json
          git add results/r6b_python_formal/r6b_python_formal_pip_freeze.txt
          if git diff --cached --quiet; then
            echo "R6B_PYTHON_FORMAL_COMMIT=NO_CHANGES"
          else
            git commit -m "R6B freeze formal Python robustness outputs"
            git push
            echo "R6B_PYTHON_FORMAL_COMMIT=PASS"
          fi
