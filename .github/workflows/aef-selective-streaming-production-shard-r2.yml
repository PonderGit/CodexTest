name: AEF Selective Streaming Production Shard R2

# R3 execution hardening: request-file push is the sole production launch path.
on:
  push:
    paths:
      - 'aef_production/request_r2.json'

permissions:
  actions: read
  contents: read

concurrency:
  group: aef-selective-streaming-production-r2
  cancel-in-progress: false

jobs:
  production_shard:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GH_TOKEN: ${{ github.token }}
      ENUM_RUN_ID: "37043849127"
      ENUM_ARTIFACT: "aef-census-metadata-enumeration-r1-37043849127"
      EXPECTED_PRIMARY_SHA256: "81943987487538619adbeb95ee26ed61dadc5fc638d61e6c577a4e2be06371b1"
      EXPECTED_CIK_HASH: "440f863ad13efe683e512d38dc4464e9370d703e1428b08e287faa3b4d4b5542"
      EXPECTED_EXTRACTOR_SHA256: "955c17cfccb43b77172309827cc279a8453c93a95942a5171344586a09ef07ed"
      EXPECTED_RETRIEVAL_SHA256: "5ed124ec9b96a827db262b0483be4f2ed4217c2321976fb948108e571b3c8509"

    steps:
      - uses: actions/checkout@v4

      - name: Validate request and frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SEC_USER_AGENT" || { echo "SEC_USER_AGENT missing" >&2; exit 2; }
          test -f aef_production/request_r2.json
          echo "$EXPECTED_EXTRACTOR_SHA256  aef_selective_preflight/R6_SEC_150_Item9A_Item4_Extractor_R4.py" | sha256sum -c -
          echo "$EXPECTED_RETRIEVAL_SHA256  aef_selective_preflight/R6_SEC_150_Retrieval_Screen_FromCache_R3.py" | sha256sum -c -

      - name: Download frozen census metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p meta_in
          gh run download "$ENUM_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ENUM_ARTIFACT" --dir meta_in
          test -f meta_in/SEC_6255_Census_Primary_10K10Q_Metadata_2018_2025_R1.csv

      - name: Prepare runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pandas
          sudo mkdir -p /mnt/data/aef_s3_extract_r4corrected /mnt/data/aef_primary_docs_all
          sudo chown -R "$USER":"$USER" /mnt/data

      - name: Execute authorized production shard
        shell: python
        run: |
          import csv,gzip,hashlib,importlib.util,io,json,os,pathlib,tarfile,time,urllib.error,urllib.parse,urllib.request,zipfile
          from collections import Counter
          from datetime import datetime,timezone

          ROOT=pathlib.Path('.')
          OUT=ROOT/'production_out'; OUT.mkdir(exist_ok=True)
          TMP=ROOT/'production_tmp'; TMP.mkdir(exist_ok=True)
          meta=ROOT/'meta_in/SEC_6255_Census_Primary_10K10Q_Metadata_2018_2025_R1.csv'
          req=json.loads((ROOT/'aef_production/request_r2.json').read_text())
          start=int(req['start_index']); count=int(req['count']); end=start+count
          pacing=float(req.get('sec_pacing_seconds',0.20))
          declared_rate=float(req.get('max_nominal_request_rate_single_job',5.0))
          if start < 0 or count <= 0 or end > 151931:
              raise RuntimeError(f'Invalid shard range start={start} count={count} end={end}')
          if pacing < 0.20 or pacing > 1.00:
              raise RuntimeError(f'Unsafe sec_pacing_seconds={pacing}; allowed range is 0.20..1.00')
          if declared_rate <= 0 or declared_rate > 5.0:
              raise RuntimeError(f'Unsafe max_nominal_request_rate_single_job={declared_rate}; allowed maximum is 5.0')
          if (1.0/pacing) > declared_rate + 1e-9:
              raise RuntimeError(f'Pacing/rate mismatch: pacing={pacing} implies {1.0/pacing:.3f} req/s > declared {declared_rate}')

          def sha_bytes(b): return hashlib.sha256(b).hexdigest()
          def sha_file(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for chunk in iter(lambda:f.read(1048576),b''): h.update(chunk)
              return h.hexdigest()

          got=sha_file(meta)
          if got != os.environ['EXPECTED_PRIMARY_SHA256']:
              raise RuntimeError(f'Primary manifest hash mismatch: {got}')
          rows=list(csv.DictReader(meta.open(encoding='utf-8')))
          if len(rows)!=151931: raise RuntimeError(f'Primary row count mismatch: {len(rows)}')
          ciks=sorted({r['cik'].strip().zfill(10) for r in rows},key=int)
          cik_hash=hashlib.sha256((''.join(c+'\n' for c in ciks)).encode()).hexdigest()
          if len(ciks)!=6255 or cik_hash!=os.environ['EXPECTED_CIK_HASH']:
              raise RuntimeError(f'Cohort identity mismatch n={len(ciks)} hash={cik_hash}')
          selected=rows[start:end]
          if len(selected)!=count: raise RuntimeError('Selected count mismatch')

          def load_module(name,path):
              spec=importlib.util.spec_from_file_location(name,path)
              mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); return mod
          ext=load_module('frozen_extractor','aef_selective_preflight/R6_SEC_150_Item9A_Item4_Extractor_R4.py')
          ret=load_module('frozen_retrieval','aef_selective_preflight/R6_SEC_150_Retrieval_Screen_FromCache_R3.py')
          if sha_file('aef_selective_preflight/R6_SEC_150_Item9A_Item4_Extractor_R4.py')!=os.environ['EXPECTED_EXTRACTOR_SHA256']: raise RuntimeError('Extractor hash mismatch')
          if sha_file('aef_selective_preflight/R6_SEC_150_Retrieval_Screen_FromCache_R3.py')!=os.environ['EXPECTED_RETRIEVAL_SHA256']: raise RuntimeError('Retrieval hash mismatch')

          ua=os.environ['SEC_USER_AGENT'].strip()
          def fetch_adaptive(url):
              attempt=0; delay=1.0
              while True:
                  attempt+=1
                  reqq=urllib.request.Request(url,headers={'User-Agent':ua,'Accept-Encoding':'identity','Host':'www.sec.gov'})
                  try:
                      with urllib.request.urlopen(reqq,timeout=90) as resp:
                          data=resp.read(); status=getattr(resp,'status',200)
                          if not (200<=status<300): raise RuntimeError(f'HTTP {status}')
                          return data,status,attempt
                  except urllib.error.HTTPError as e:
                      retryable=(e.code==429 or 500<=e.code<600)
                      if (not retryable) or attempt>=5: raise
                      ra=e.headers.get('Retry-After')
                      wait=float(ra) if ra and ra.isdigit() else delay
                      time.sleep(min(max(wait,1.0),30.0)); delay=min(delay*2,30.0)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt>=5: raise
                      time.sleep(delay); delay=min(delay*2,30.0)

          tag=f'{start:06d}_{end-1:06d}'
          transient_path=OUT/f'AEF_ProductionShard_{tag}_Transient_All_Raw_R1.tar.gz'
          retained_path=OUT/f'AEF_ProductionShard_{tag}_Retained_Raw_R1.tar.gz'
          prov=[]; derived=[]; retention=[]; failures=[]
          t_all=tarfile.open(transient_path,'w:gz',compresslevel=6)
          t_keep=tarfile.open(retained_path,'w:gz',compresslevel=6)
          try:
              for j,r in enumerate(selected):
                  global_index=start+j
                  cik=r['cik'].strip().zfill(10); acc=r['accession_number'].strip(); primary=r['primary_document'].strip()
                  acc_clean=acc.replace('-','')
                  url=f'https://www.sec.gov/Archives/edgar/data/{int(cik)}/{acc_clean}/{urllib.parse.quote(primary,safe="._-")}'
                  tmp=TMP/f'{global_index:06d}.raw'
                  try:
                      data,status,attempts=fetch_adaptive(url)
                      tmp.write_bytes(data)
                      raw_sha=sha_bytes(data)
                      safe=pathlib.PurePosixPath(primary).name.replace('/','_')
                      tar_name=f'{global_index:06d}__{cik}__{acc}__{safe}'
                      ti=tarfile.TarInfo(tar_name); ti.size=len(data); ti.mtime=0; ti.mode=0o644
                      t_all.addfile(ti,io.BytesIO(data))

                      text=ext.html_text(tmp)
                      section,section_status=ext.extract(text,r['form'])
                      hit,components=ret.screen(section,section_status,r['form'])
                      if section_status not in ret.USABLE:
                          retention_class='HOLD_UNRESOLVED_EXTRACTION'; release_state='NOT_ELIGIBLE'
                      elif hit:
                          retention_class='HOLD_CANDIDATE'; release_state='NOT_ELIGIBLE'
                      else:
                          retention_class='TRANSIENT_RELEASE_ELIGIBLE_PENDING_DRIVE_READBACK'; release_state='PENDING_DRIVE_READBACK'

                      if retention_class.startswith('HOLD_'):
                          ti2=tarfile.TarInfo(tar_name); ti2.size=len(data); ti2.mtime=0; ti2.mode=0o644
                          t_keep.addfile(ti2,io.BytesIO(data))

                      sec_sha=sha_bytes(section.encode('utf-8'))
                      base={
                          'global_index':global_index,'cik':cik,'accession_number':acc,'form':r['form'],
                          'filing_date':r['filing_date'],'report_date':r.get('report_date',''),
                          'primary_document':primary,'source_url':url,'retrieval_utc':datetime.now(timezone.utc).isoformat(),
                          'http_status':status,'attempts':attempts,'raw_bytes':len(data),'raw_sha256':raw_sha,
                          'extractor_sha256':os.environ['EXPECTED_EXTRACTOR_SHA256'],
                          'retrieval_rule_sha256':os.environ['EXPECTED_RETRIEVAL_SHA256'],
                          'section_status':section_status,'section_len':len(section),'section_sha256':sec_sha,
                          'candidate_retrieval_hit':int(hit),'retrieval_rule_components':';'.join(components),
                          'retention_class':retention_class,'release_state':release_state
                      }
                      prov.append(base)
                      derived.append({
                          'global_index':global_index,'cik':cik,'accession_number':acc,'form':r['form'],'filing_date':r['filing_date'],
                          'section_status':section_status,'section_len':len(section),'section_sha256':sec_sha,'section_text':section,
                          'candidate_retrieval_hit':int(hit),'retrieval_rule_components':components,'retention_class':retention_class
                      })
                      retention.append({
                          'global_index':global_index,'cik':cik,'accession_number':acc,'form':r['form'],
                          'retention_class':retention_class,'release_state':release_state,
                          'raw_sha256':raw_sha,'section_sha256':sec_sha
                      })
                  except Exception as e:
                      failures.append({
                          'global_index':global_index,'cik':cik,'accession_number':acc,'form':r['form'],
                          'filing_date':r.get('filing_date',''),'primary_document':primary,'source_url':url,
                          'error':type(e).__name__+': '+str(e)[:500]
                      })
                  finally:
                      try: tmp.unlink(missing_ok=True)
                      except Exception: pass
                  time.sleep(pacing)
          finally:
              t_all.close(); t_keep.close()

          prov_path=OUT/f'AEF_ProductionShard_{tag}_Provenance_R1.csv'
          fields=list(prov[0].keys()) if prov else ['global_index']
          with prov_path.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(prov)
          ret_path=OUT/f'AEF_ProductionShard_{tag}_Retention_Ledger_R1.csv'
          rfields=list(retention[0].keys()) if retention else ['global_index']
          with ret_path.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=rfields);w.writeheader();w.writerows(retention)
          der_path=OUT/f'AEF_ProductionShard_{tag}_Derived_Evidence_R1.jsonl.gz'
          with gzip.open(der_path,'wt',encoding='utf-8') as f:
              for x in derived:f.write(json.dumps(x,ensure_ascii=False)+'\n')
          fail_path=OUT/f'AEF_ProductionShard_{tag}_Failures_R1.csv'
          ffields=['global_index','cik','accession_number','form','filing_date','primary_document','source_url','error']
          with fail_path.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=ffields);w.writeheader();w.writerows(failures)

          counts=Counter(x['retention_class'] for x in retention)
          statuses=Counter(x['section_status'] for x in prov)
          with tarfile.open(transient_path,'r:gz') as tf: transient_members=len(tf.getmembers())
          with tarfile.open(retained_path,'r:gz') as tf: retained_members=len(tf.getmembers())
          success=len(prov)
          complete=(success==count and not failures and transient_members==count and retained_members==(counts.get('HOLD_CANDIDATE',0)+counts.get('HOLD_UNRESOLVED_EXTRACTION',0)))

          summary={
              'stage':'SELECTIVE_STREAMING_ACQUISITION_EXECUTION',
              'control_at_start':req.get('control','UNKNOWN'),'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'commit_sha':os.environ.get('GITHUB_SHA'),
              'request':req,'start_index':start,'end_index_exclusive':end,'count':count,
              'manifest_sha256':got,'cohort_n':len(ciks),'cohort_cik_hash':cik_hash,
              'success_n':success,'failure_n':len(failures),'retention_counts':dict(counts),'section_status_counts':dict(statuses),
              'transient_raw_archive_members':transient_members,'retained_raw_archive_members':retained_members,
              'extractor_sha256':os.environ['EXPECTED_EXTRACTOR_SHA256'],'retrieval_rule_sha256':os.environ['EXPECTED_RETRIEVAL_SHA256'],
              'sec_pacing_seconds':pacing,'max_nominal_request_rate_single_job':declared_rate,
              'provenance_sha256':sha_file(prov_path),'derived_evidence_sha256':sha_file(der_path),'retention_ledger_sha256':sha_file(ret_path),
              'transient_raw_sha256':sha_file(transient_path),'retained_raw_sha256':sha_file(retained_path),
              'clear_nohit_release_state':'PENDING_GOOGLE_DRIVE_PERSISTENCE_AND_READBACK',
              'retrieval_hit_is_not_treatment':True,'unusable_extraction_is_not_negative':True,
              'complete':complete,'completed_at_utc':datetime.now(timezone.utc).isoformat()
          }
          sum_path=OUT/f'AEF_ProductionShard_{tag}_Summary_R1.json'
          sum_path.write_text(json.dumps(summary,indent=2),encoding='utf-8')

          permanent=OUT/f'AEF_ProductionShard_{tag}_Permanent_Bundle_R1.zip'
          with zipfile.ZipFile(permanent,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in [prov_path,ret_path,der_path,fail_path,retained_path,sum_path,ROOT/'aef_production/request_r2.json']:
                  z.write(p,p.name)
              z.write('aef_selective_preflight/R6_SEC_150_Item9A_Item4_Extractor_R4.py','frozen_code/R6_SEC_150_Item9A_Item4_Extractor_R4.py')
              z.write('aef_selective_preflight/R6_SEC_150_Retrieval_Screen_FromCache_R3.py','frozen_code/R6_SEC_150_Retrieval_Screen_FromCache_R3.py')
          bundle_sha=sha_file(permanent)
          manifest_out=OUT/f'AEF_ProductionShard_{tag}_Bundle_Manifest_R1.json'
          manifest_out.write_text(json.dumps({
              'permanent_bundle_file':permanent.name,'permanent_bundle_sha256':bundle_sha,'permanent_bundle_bytes':permanent.stat().st_size,
              'transient_raw_file':transient_path.name,'transient_raw_sha256':summary['transient_raw_sha256'],'transient_raw_bytes':transient_path.stat().st_size,
              'summary_file':sum_path.name,'summary_sha256':sha_file(sum_path),
              'retention_barrier':'TRANSIENT_RAW_MUST_NOT_BE_DELETED_UNTIL_GOOGLE_DRIVE_CRYPTOGRAPHIC_PERSISTENCE_READBACK_PASS'
          },indent=2),encoding='utf-8')
          if sha_file(permanent)!=bundle_sha: raise RuntimeError('Permanent bundle mutated after final hash')
          print(json.dumps(summary,indent=2))
          if not complete: raise RuntimeError('Production shard failed closed; inspect failure package')

      - name: Build self-verifying Drive persistence set
        if: success()
        shell: python
        run: |
          import csv,gzip,hashlib,json,pathlib,tarfile,zipfile,shutil,os

          ROOT=pathlib.Path('.')
          OUT=ROOT/'production_out'
          PERSIST=ROOT/'persistence_out'
          CORE=PERSIST/'formal_core'
          CHUNKS=PERSIST/'chunks'
          CORE.mkdir(parents=True,exist_ok=True); CHUNKS.mkdir(parents=True,exist_ok=True)

          req=json.loads((ROOT/'aef_production/request_r2.json').read_text())
          start=int(req['start_index']); count=int(req['count']); end=start+count
          tag=f'{start:06d}_{end-1:06d}'

          def one(glob):
              xs=list(OUT.glob(glob))
              if len(xs)!=1: raise RuntimeError(f'Expected exactly one {glob}, found {len(xs)}')
              return xs[0]
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1048576),b''): h.update(b)
              return h.hexdigest()

          summary_path=one(f'AEF_ProductionShard_{tag}_Summary_R1.json')
          bundle_manifest_path=one(f'AEF_ProductionShard_{tag}_Bundle_Manifest_R1.json')
          permanent=one(f'AEF_ProductionShard_{tag}_Permanent_Bundle_R1.zip')
          transient=one(f'AEF_ProductionShard_{tag}_Transient_All_Raw_R1.tar.gz')
          summary=json.loads(summary_path.read_text())
          bman=json.loads(bundle_manifest_path.read_text())

          source_checks={
              'request_start': int(summary['start_index'])==start,
              'request_end': int(summary['end_index_exclusive'])==end,
              'request_count': int(summary['count'])==count,
              'success_all': int(summary['success_n'])==count,
              'failure_zero': int(summary['failure_n'])==0,
              'complete_true': summary['complete'] is True,
              'transient_members': int(summary['transient_raw_archive_members'])==count,
              'retained_mapping': int(summary['retained_raw_archive_members'])==
                  int(summary['retention_counts'].get('HOLD_CANDIDATE',0))+
                  int(summary['retention_counts'].get('HOLD_UNRESOLVED_EXTRACTION',0)),
              'permanent_hash_matches_manifest': sha(permanent)==bman['permanent_bundle_sha256'],
              'permanent_hash_stable': sha(permanent)==sha(permanent),
              'transient_hash_matches_summary': sha(transient)==summary['transient_raw_sha256'],
              'barrier_exact': bman['retention_barrier']=='TRANSIENT_RAW_MUST_NOT_BE_DELETED_UNTIL_GOOGLE_DRIVE_CRYPTOGRAPHIC_PERSISTENCE_READBACK_PASS',
              'hit_not_treatment': summary.get('retrieval_hit_is_not_treatment') is True,
              'unusable_not_negative': summary.get('unusable_extraction_is_not_negative') is True,
          }
          if not all(source_checks.values()):
              raise RuntimeError('SOURCE_CHECK_FAILURE '+json.dumps(source_checks,sort_keys=True))

          work=ROOT/'verify_bundle'; work.mkdir(exist_ok=True)
          with zipfile.ZipFile(permanent) as z: z.extractall(work)
          prov=list(work.glob('*_Provenance_R1.csv'))
          ledger=list(work.glob('*_Retention_Ledger_R1.csv'))
          derived=list(work.glob('*_Derived_Evidence_R1.jsonl.gz'))
          retained=list(work.glob('*_Retained_Raw_R1.tar.gz'))
          if not (len(prov)==len(ledger)==len(derived)==len(retained)==1):
              raise RuntimeError('PERMANENT_BUNDLE_CARDINALITY_FAILURE')
          prov,ledger,derived,retained=prov[0],ledger[0],derived[0],retained[0]

          with prov.open(encoding='utf-8') as f: prov_rows=list(csv.DictReader(f))
          with ledger.open(encoding='utf-8') as f: ledger_rows=list(csv.DictReader(f))
          with gzip.open(derived,'rt',encoding='utf-8') as f: derived_rows=[json.loads(x) for x in f if x.strip()]
          with tarfile.open(retained,'r:gz') as tf: retained_names=tf.getnames()

          expected_idx=set(range(start,end))
          prov_idx={int(x['global_index']) for x in prov_rows}
          ledger_idx={int(x['global_index']) for x in ledger_rows}
          derived_idx={int(x['global_index']) for x in derived_rows}
          hold_rows=[x for x in ledger_rows if x['retention_class'].startswith('HOLD_')]
          clear_rows=[x for x in ledger_rows if x['retention_class']=='TRANSIENT_RELEASE_ELIGIBLE_PENDING_DRIVE_READBACK']

          inner_checks={
              'prov_n':len(prov_rows)==count,
              'ledger_n':len(ledger_rows)==count,
              'derived_n':len(derived_rows)==count,
              'prov_exact_range':prov_idx==expected_idx,
              'ledger_exact_range':ledger_idx==expected_idx,
              'derived_exact_range':derived_idx==expected_idx,
              'retained_n':len(retained_names)==len(hold_rows)==int(summary['retained_raw_archive_members']),
              'clear_n':len(clear_rows)==int(summary['retention_counts'].get('TRANSIENT_RELEASE_ELIGIBLE_PENDING_DRIVE_READBACK',0)),
              'prov_sha':sha(prov)==summary['provenance_sha256'],
              'ledger_sha':sha(ledger)==summary['retention_ledger_sha256'],
              'derived_sha':sha(derived)==summary['derived_evidence_sha256'],
              'retained_sha':sha(retained)==summary['retained_raw_sha256'],
          }
          if not all(inner_checks.values()):
              raise RuntimeError('INNER_CHECK_FAILURE '+json.dumps(inner_checks,sort_keys=True))

          bundle_sha=sha(permanent)
          bundle_bytes=permanent.stat().st_size
          CHUNK_SIZE=20*1024*1024
          MAX_CHUNKS=8
          parts=[]
          with permanent.open('rb') as f:
              i=0
              while True:
                  data=f.read(CHUNK_SIZE)
                  if not data: break
                  if i>=MAX_CHUNKS: raise RuntimeError('PERMANENT_BUNDLE_TOO_LARGE_FOR_CURRENT_CHECKPOINT_CHUNK_POLICY')
                  p=CHUNKS/f'AEF_CP_{tag}_Permanent_Bundle_R1.part{i:03d}'
                  p.write_bytes(data)
                  parts.append({'order':i,'file':p.name,'bytes':len(data),'sha256':sha(p)})
                  i+=1

          # Reconstruct immediately from generated parts before any upload.
          h=hashlib.sha256(); reconstructed_bytes=0
          for part in parts:
              p=CHUNKS/part['file']
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1048576),b''):
                      h.update(b); reconstructed_bytes+=len(b)
          local_reconstruction_sha=h.hexdigest()
          if reconstructed_bytes!=bundle_bytes or local_reconstruction_sha!=bundle_sha:
              raise RuntimeError('LOCAL_CHUNK_RECONSTRUCTION_FAILURE')

          resume={
              'accepted_checkpoint_start':start,
              'accepted_checkpoint_end_exclusive':end,
              'next_start_index':end,
              'default_next_count':count,
              'total_manifest_rows':151931,
              'remaining_after_checkpoint':151931-end,
              'may_auto_advance_only_after_drive_crypto_readback':True
          }
          acceptance={
              'schema':'AEF_CHECKPOINT_ACCEPTANCE_R2',
              'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
              'commit_sha':os.environ.get('GITHUB_SHA'),
              'control_at_start':req.get('control'),
              'checkpoint_start':start,
              'checkpoint_end_exclusive':end,
              'checkpoint_count':count,
              'success_n':int(summary['success_n']),
              'failure_n':int(summary['failure_n']),
              'retention_counts':summary['retention_counts'],
              'section_status_counts':summary['section_status_counts'],
              'source_checks':source_checks,
              'inner_checks':inner_checks,
              'permanent_bundle_file':permanent.name,
              'permanent_bundle_bytes':bundle_bytes,
              'permanent_bundle_sha256':bundle_sha,
              'chunk_size_bytes':CHUNK_SIZE,
              'chunk_count':len(parts),
              'parts':parts,
              'local_chunk_reconstruction_bytes':reconstructed_bytes,
              'local_chunk_reconstruction_sha256':local_reconstruction_sha,
              'transient_raw_file':transient.name,
              'transient_raw_sha256':summary['transient_raw_sha256'],
              'transient_raw_members':int(summary['transient_raw_archive_members']),
              'drive_crypto_readback_required_before_transient_release':True,
              'retrieval_hit_is_not_treatment':True,
              'unusable_extraction_is_not_negative':True,
              'resume_token':resume,
              'local_acceptance':'PASS'
          }

          # Formal core contains only compact durable metadata; large permanent data are in chunks.
          shutil.copy2(summary_path,CORE/summary_path.name)
          shutil.copy2(bundle_manifest_path,CORE/bundle_manifest_path.name)
          shutil.copy2(ROOT/'aef_production/request_r2.json',CORE/'request_r2.json')
          (CORE/f'AEF_CP_{tag}_Acceptance_R2.json').write_text(json.dumps(acceptance,indent=2))
          (CORE/f'AEF_CP_{tag}_ResumeToken_R2.json').write_text(json.dumps(resume,indent=2))
          (CORE/f'AEF_CP_{tag}_ChunkManifest_R2.json').write_text(json.dumps({
              'permanent_bundle_file':permanent.name,
              'permanent_bundle_bytes':bundle_bytes,
              'permanent_bundle_sha256':bundle_sha,
              'parts':parts,
              'reconstruction':'concatenate inner part files in ascending order and verify full SHA-256'
          },indent=2))

          print(json.dumps(acceptance,indent=2))

