name: OMOSSP C19 Batch3 Shard1 execution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c19-batch3-shard1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: FREE-ONLY hard gate
        shell: bash
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          test "$REPO_VISIBILITY" = "public" || exit 96
          echo "FREE_ONLY_GATE=PASS__PUBLIC_REPO__STANDARD_UBUNTU_RUNNER__NO_ARTIFACT_CACHE"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen C18 production authority
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib
          assert hashlib.sha256(pathlib.Path("production_batches/omossp_c18_batch3.json").read_bytes()).hexdigest()=="99c0bf78dda02af521dddf1e05670e7302b9b9ad94daecc00148100722022c5c"
          assert hashlib.sha256(pathlib.Path("omossp_c18_production_worker.py").read_bytes()).hexdigest()=="cfc3145818e4ed86dff774d08a19aaf17bf04673fba92f39b2e948db77195297"
          print("C19_AUTHORITY_GATE=PASS")
          PY
      - name: Run frozen Batch3 Shard1 only
        env:
          OMOSSP_BATCH_FILE: production_batches/omossp_c18_batch3.json
          OMOSSP_SHARD: "1"
        run: python omossp_c18_production_worker.py
      - name: Emit replayable Shard1 result
        shell: bash
        run: |
          echo "===== OMOSSP_C19_SHARD1_CANONICAL_SHA256 ====="
          cat omossp_c18_output/c18_batch3_shard1.sha256
          echo "===== OMOSSP_C19_SHARD1_JSON_BEGIN ====="
          cat omossp_c18_output/c18_batch3_shard1.json
          echo "===== OMOSSP_C19_SHARD1_JSON_END ====="
