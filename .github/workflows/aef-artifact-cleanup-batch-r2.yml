name: AEF Artifact Cleanup Batch R2

on:
  push:
    paths:
      - 'aef_cleanup/request_batch.json'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate external Drive-attested cleanup request and batch-delete source artifacts
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, pathlib, re, subprocess
          req=json.loads(pathlib.Path('aef_cleanup/request_batch.json').read_text())
          # The GitHub runner does not independently access Google Drive.
          # These fields are an execution attestation produced only after the
          # external connector-mediated Drive read-back/reconstruction has passed.
          if req.get('drive_crypto_readback') != 'PASS':
              raise SystemExit('External Drive cryptographic readback attestation is not PASS')
          formal_core_id=str(req.get('drive_formal_core_id','')).strip()
          part_ids=req.get('drive_part_ids',[])
          bundle_sha=str(req.get('reconstructed_bundle_sha256','')).strip().lower()
          if not formal_core_id or not isinstance(part_ids,list) or not part_ids:
              raise SystemExit('Missing persisted Drive object identities')
          if not re.fullmatch(r'[0-9a-f]{64}',bundle_sha):
              raise SystemExit('Invalid reconstructed bundle SHA-256 attestation')
          repo=os.environ['GITHUB_REPOSITORY']
          run_id=int(req['source_run_id'])
          if run_id <= 0:
              raise SystemExit('Invalid source_run_id')
          allowed_prefixes=req.get('allowed_name_prefixes',['aef-production-r2-'])
          page=json.loads(subprocess.check_output(
              ['gh','api',f'/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100'],
              text=True
          ))
          artifacts=page.get('artifacts',[])
          bad=[a['name'] for a in artifacts if not any(a['name'].startswith(p) for p in allowed_prefixes)]
          if bad:
              raise SystemExit('Unexpected artifact names for accepted run: '+json.dumps(bad))
          # Discovery is run-derived: no hand-copied artifact IDs.
          deleted=[]
          for a in artifacts:
              subprocess.check_call(['gh','api','--method','DELETE',f"/repos/{repo}/actions/artifacts/{a['id']}"])
              deleted.append({'artifact_id':a['id'],'name':a['name'],'status':'DELETED'})
          # Read back run artifact list; acceptance requires zero remaining.
          after=json.loads(subprocess.check_output(
              ['gh','api',f'/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100'],
              text=True
          )).get('artifacts',[])
          if after:
              raise SystemExit('Artifacts remain after cleanup: '+json.dumps([a['name'] for a in after]))
          print(json.dumps({'source_run_id':run_id,'deleted':deleted,'remaining_count':0},indent=2))
