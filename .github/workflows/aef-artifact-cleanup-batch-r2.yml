name: AEF Artifact Cleanup Batch R2

on:
  push:
    paths:
      - 'aef_cleanup/request_batch.json'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate and batch-delete persisted checkpoint artifacts
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, pathlib, subprocess
          req=json.loads(pathlib.Path('aef_cleanup/request_batch.json').read_text())
          if req.get('drive_crypto_readback') != 'PASS':
              raise SystemExit('Drive cryptographic readback is not PASS')
          items=req.get('artifacts',[])
          if not items:
              raise SystemExit('No artifacts requested')
          repo=os.environ['GITHUB_REPOSITORY']
          checked=[]
          already_absent=[]
          for item in items:
              aid=int(item['artifact_id'])
              expected=str(item['expected_name'])
              p=subprocess.run(
                  ['gh','api',f'/repos/{repo}/actions/artifacts/{aid}'],
                  text=True,capture_output=True
              )
              if p.returncode != 0:
                  if 'HTTP 404' in (p.stderr or '') or 'Not Found' in (p.stderr or ''):
                      already_absent.append({'artifact_id':aid,'name':expected,'status':'ALREADY_ABSENT'})
                      continue
                  raise SystemExit(f'Artifact lookup failed for {aid}: {p.stderr}')
              got=json.loads(p.stdout)
              if got.get('name') != expected:
                  raise SystemExit(f'Artifact name mismatch for {aid}: {got.get("name")} != {expected}')
              checked.append((aid,expected))
          # All extant identities verify before the first delete.
          deleted=[]
          for aid,expected in checked:
              subprocess.check_call(['gh','api','--method','DELETE',f'/repos/{repo}/actions/artifacts/{aid}'])
              deleted.append({'artifact_id':aid,'name':expected,'status':'DELETED'})
          print(json.dumps({'deleted':deleted,'already_absent':already_absent,'requested_count':len(items)},indent=2))
