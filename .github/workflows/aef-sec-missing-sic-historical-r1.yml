name: AEF SEC Missing Current SIC Historical Audit R1

on:
  push:
    paths:
      - '.github/workflows/aef-sec-missing-sic-historical-r1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  resolve-missing-sic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GH_TOKEN: ${{ github.token }}
      STAGE1_RUN_ID: "36326091348"
      STAGE1_ARTIFACT: "aef-sec-fullframe-sic-r1-36326091348"
    steps:
      - name: Validate protected identifiers
        shell: bash
        run: |
          test -n "$SEC_USER_AGENT" || { echo "SEC_USER_AGENT missing" >&2; exit 2; }
          test -n "$GH_TOKEN" || { echo "GH_TOKEN missing" >&2; exit 2; }

      - name: Download frozen Stage 1 artifact
        shell: bash
        run: |
          mkdir -p stage1_in
          gh run download "$STAGE1_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$STAGE1_ARTIFACT" --dir stage1_in
          test -f stage1_in/SEC_2018_Exact10K_Frame_SIC_Map_R1.csv

      - name: Resolve historical SIC from 2018 canonical 10-K headers
        shell: python
        run: |
          import csv, hashlib, json, os, pathlib, re, time, urllib.request
          from datetime import datetime, timezone

          ua=os.environ['SEC_USER_AGENT'].strip()
          inp=pathlib.Path('stage1_in/SEC_2018_Exact10K_Frame_SIC_Map_R1.csv')
          out=pathlib.Path('aef_stage2_sic')
          out.mkdir(exist_ok=True)

          rows=list(csv.DictReader(inp.open(encoding='utf-8')))
          missing=[r for r in rows if not (r.get('sic') or '').strip()]
          assert len(rows)==6907
          assert len(missing)==91, len(missing)

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept-Encoding':'identity'})
              with urllib.request.urlopen(req,timeout=60) as resp:
                  data=resp.read()
                  return data, getattr(resp,'status',200), resp.headers.get('Last-Modified'), resp.headers.get('ETag')

          def parse_sic(text):
              patterns=[
                  r'<ASSIGNED-SIC>\s*([0-9]{4})',
                  r'STANDARD INDUSTRIAL CLASSIFICATION:\s*.*?\[([0-9]{4})\]',
                  r'ASSIGNED SIC:\s*([0-9]{4})',
              ]
              for pat in patterns:
                  m=re.search(pat,text,re.I|re.S)
                  if m:
                      return m.group(1)
              return ''

          audited=[]
          for i,r in enumerate(missing,1):
              fn=(r.get('canonical_display_filename') or '').strip().lstrip('/')
              if not fn:
                  audited.append({**r,'historical_sic_2018':'','historical_sic_parse_status':'NO_FILENAME','filing_url':'','filing_bytes':'','filing_sha256':''})
                  continue
              url='https://www.sec.gov/Archives/'+fn
              data,status,last_modified,etag=fetch(url)
              sic=parse_sic(data.decode('latin-1','replace')[:300000])
              audited.append({
                  **r,
                  'historical_sic_2018':sic,
                  'historical_sic_parse_status':'RESOLVED' if sic else 'UNRESOLVED',
                  'filing_url':url,
                  'filing_http_status':status,
                  'filing_last_modified':last_modified or '',
                  'filing_etag':etag or '',
                  'filing_bytes':len(data),
                  'filing_sha256':hashlib.sha256(data).hexdigest(),
              })
              time.sleep(0.15)

          fields=list(audited[0].keys())
          csv_path=out/'SEC_2018_MissingCurrentSIC_HistoricalSIC_Audit_R1.csv'
          with csv_path.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(audited)

          resolved=[x for x in audited if x['historical_sic_parse_status']=='RESOLVED']
          unresolved=[x for x in audited if x['historical_sic_parse_status']!='RESOLVED']
          hist6189=[x for x in audited if x.get('historical_sic_2018')=='6189']
          summary={
              'stage':'S2_MISSING_CURRENT_SIC_HISTORICAL_AUDIT',
              'retrieved_at_utc':datetime.now(timezone.utc).isoformat(),
              'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
              'stage1_run_id':os.environ.get('STAGE1_RUN_ID'),
              'stage1_map_sha256':hashlib.sha256(inp.read_bytes()).hexdigest(),
              'full_frame_n':len(rows),
              'current_sic_missing_n':len(missing),
              'historical_sic_resolved_n':len(resolved),
              'historical_sic_unresolved_n':len(unresolved),
              'historical_sic6189_among_current_missing_n':len(hist6189),
              'output_csv_sha256':hashlib.sha256(csv_path.read_bytes()).hexdigest(),
              'unresolved_ciks':[x['cik'] for x in unresolved],
              'historical_sic6189_ciks':[x['cik'] for x in hist6189],
          }
          (out/'SEC_2018_MissingCurrentSIC_HistoricalSIC_Audit_Summary_R1.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))

      - name: Upload Stage 2 audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: aef-sec-missing-sic-historical-r1-${{ github.run_id }}
          path: aef_stage2_sic/
          if-no-files-found: error
          retention-days: 5
          compression-level: 6

      - name: Publish restartable Stage 2 status
        if: always()
        shell: python
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          import base64, json, os, pathlib, urllib.request, urllib.error
          repo=os.environ['GITHUB_REPOSITORY']; run_id=os.environ['GITHUB_RUN_ID']
          p=pathlib.Path('aef_stage2_sic/SEC_2018_MissingCurrentSIC_HistoricalSIC_Audit_Summary_R1.json')
          summary=json.loads(p.read_text()) if p.exists() else None
          obj={'workflow':'AEF SEC Missing Current SIC Historical Audit R1','run_id':run_id,'job_status':os.environ.get('JOB_STATUS'),'trigger_commit_sha':os.environ.get('GITHUB_SHA'),'artifact_name':f'aef-sec-missing-sic-historical-r1-{run_id}','summary':summary}
          content=(json.dumps(obj,indent=2)+'\n').encode()
          api=f'https://api.github.com/repos/{repo}/contents/aef_stage2/latest_run.json'
          headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'AEF-stage2-status'}
          sha=None
          try:
              with urllib.request.urlopen(urllib.request.Request(api,headers=headers),timeout=30) as r:
                  sha=json.loads(r.read().decode()).get('sha')
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
          body={'message':f'AEF Stage 2 status for run {run_id}','content':base64.b64encode(content).decode()}
          if sha: body['sha']=sha
          req=urllib.request.Request(api,data=json.dumps(body).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r: print(r.status)
