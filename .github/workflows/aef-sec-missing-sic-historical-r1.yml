name: AEF SEC Missing SIC Reporting Profile R2

on:
  push:
    paths:
      - '.github/workflows/aef-sec-missing-sic-historical-r1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  audit-reporting-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GH_TOKEN: ${{ github.token }}
      STAGE1_RUN_ID: "36326091348"
      STAGE1_ARTIFACT: "aef-sec-fullframe-sic-r1-36326091348"
    steps:
      - name: Validate protected identifiers
        shell: bash
        run: |
          test -n "$SEC_USER_AGENT" || { echo "SEC_USER_AGENT missing" >&2; exit 2; }
          test -n "$GH_TOKEN" || { echo "GH_TOKEN missing" >&2; exit 2; }

      - name: Download frozen Stage 1 artifact
        shell: bash
        run: |
          mkdir -p stage1_in
          gh run download "$STAGE1_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$STAGE1_ARTIFACT" --dir stage1_in
          test -f stage1_in/SEC_2018_Exact10K_Frame_SIC_Map_R1.csv

      - name: Audit reporting profiles for current-SIC-missing issuers
        shell: python
        run: |
          import csv, hashlib, json, os, pathlib, time, urllib.request
          from collections import Counter
          from datetime import datetime, timezone

          ua=os.environ['SEC_USER_AGENT'].strip()
          inp=pathlib.Path('stage1_in/SEC_2018_Exact10K_Frame_SIC_Map_R1.csv')
          out=pathlib.Path('aef_stage2_sic_r2')
          out.mkdir(exist_ok=True)
          rows=list(csv.DictReader(inp.open(encoding='utf-8')))
          missing=[r for r in rows if not (r.get('sic') or '').strip()]
          assert len(rows)==6907
          assert len(missing)==91

          def get_json(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept-Encoding':'identity'})
              with urllib.request.urlopen(req,timeout=60) as resp:
                  return json.loads(resp.read().decode('utf-8')), getattr(resp,'status',200)

          audited=[]
          for r in missing:
              cik=r['cik']
              base=f'https://data.sec.gov/submissions/CIK{cik}.json'
              obj,status=get_json(base)
              entries=[]
              recent=obj.get('filings',{}).get('recent',{})
              n=len(recent.get('form',[]))
              for i in range(n):
                  entries.append({
                      'form':recent['form'][i],
                      'filingDate':recent['filingDate'][i],
                  })
              for extra in obj.get('filings',{}).get('files',[]) or []:
                  name=extra.get('name')
                  if not name: continue
                  ex,_=get_json('https://data.sec.gov/submissions/'+name)
                  m=len(ex.get('form',[]))
                  for i in range(m):
                      entries.append({'form':ex['form'][i],'filingDate':ex['filingDate'][i]})
                  time.sleep(0.08)

              window=[e for e in entries if '2018-01-01' <= e.get('filingDate','') <= '2025-12-31']
              cnt=Counter(e['form'] for e in window)
              n10k=cnt['10-K']; n10q=cnt['10-Q']; n10d=cnt['10-D']; nabs=cnt['ABS-15G']+cnt['ABS-15G/A']
              if n10d>0 or nabs>0:
                  profile='ABS_LIKE'
              elif n10q>0:
                  profile='STANDARD_10K_10Q'
              elif n10k>0:
                  profile='TEN_K_ONLY_OTHER'
              else:
                  profile='NO_EXACT_10K_10Q_IN_WINDOW'
              audited.append({
                  **r,
                  'submissions_http_status':status,
                  'forms_2018_2025_total':len(window),
                  'n_10k_2018_2025':n10k,
                  'n_10q_2018_2025':n10q,
                  'n_10d_2018_2025':n10d,
                  'n_abs15g_2018_2025':nabs,
                  'n_n2_family_2018_2025':sum(v for k,v in cnt.items() if k.startswith('N-2')),
                  'n_n54_family_2018_2025':sum(v for k,v in cnt.items() if k.startswith('N-54')),
                  'reporting_profile':profile,
                  'top_forms_json':json.dumps(cnt.most_common(12)),
              })
              time.sleep(0.12)

          fields=list(audited[0].keys())
          csv_path=out/'SEC_2018_MissingCurrentSIC_ReportingProfile_Audit_R2.csv'
          with csv_path.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(audited)

          pc=Counter(x['reporting_profile'] for x in audited)
          abs_like=[x for x in audited if x['reporting_profile']=='ABS_LIKE']
          tenk_only=[x for x in audited if x['reporting_profile']=='TEN_K_ONLY_OTHER']
          summary={
              'stage':'S2_MISSING_CURRENT_SIC_REPORTING_PROFILE_AUDIT_R2',
              'retrieved_at_utc':datetime.now(timezone.utc).isoformat(),
              'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
              'stage1_run_id':os.environ.get('STAGE1_RUN_ID'),
              'stage1_map_sha256':hashlib.sha256(inp.read_bytes()).hexdigest(),
              'full_frame_n':len(rows),
              'current_sic_missing_n':len(missing),
              'profile_counts':dict(sorted(pc.items())),
              'abs_like_n':len(abs_like),
              'abs_like_ciks':[x['cik'] for x in abs_like],
              'ten_k_only_other_n':len(tenk_only),
              'ten_k_only_other_ciks':[x['cik'] for x in tenk_only],
              'output_csv_sha256':hashlib.sha256(csv_path.read_bytes()).hexdigest(),
          }
          (out/'SEC_2018_MissingCurrentSIC_ReportingProfile_Audit_Summary_R2.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))

      - name: Upload Stage 2 R2 audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: aef-sec-missing-sic-profile-r2-${{ github.run_id }}
          path: aef_stage2_sic_r2/
          if-no-files-found: error
          retention-days: 5
          compression-level: 6

      - name: Publish restartable Stage 2 status
        if: always()
        shell: python
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          import base64, json, os, pathlib, urllib.request, urllib.error
          repo=os.environ['GITHUB_REPOSITORY']; run_id=os.environ['GITHUB_RUN_ID']
          p=pathlib.Path('aef_stage2_sic_r2/SEC_2018_MissingCurrentSIC_ReportingProfile_Audit_Summary_R2.json')
          summary=json.loads(p.read_text()) if p.exists() else None
          obj={'workflow':'AEF SEC Missing SIC Reporting Profile R2','run_id':run_id,'job_status':os.environ.get('JOB_STATUS'),'trigger_commit_sha':os.environ.get('GITHUB_SHA'),'artifact_name':f'aef-sec-missing-sic-profile-r2-{run_id}','summary':summary}
          content=(json.dumps(obj,indent=2)+'\n').encode()
          api=f'https://api.github.com/repos/{repo}/contents/aef_stage2/latest_run.json'
          headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'AEF-stage2-status'}
          sha=None
          try:
              with urllib.request.urlopen(urllib.request.Request(api,headers=headers),timeout=30) as rr:
                  sha=json.loads(rr.read().decode()).get('sha')
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
          body={'message':f'AEF Stage 2 R2 status for run {run_id}','content':base64.b64encode(content).decode()}
          if sha: body['sha']=sha
          req=urllib.request.Request(api,data=json.dumps(body).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req,timeout=30) as rr: print(rr.status)
