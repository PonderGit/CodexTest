name: OMOSSP C21 locator-role offline regression
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  c21-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: FREE-ONLY hard gate
        shell: bash
        run: |
          test "${{ github.event.repository.private }}" = "false"
          echo "FREE_ONLY_GATE=PASS__PUBLIC_REPO__STANDARD_UBUNTU_RUNNER__NO_ARTIFACT_CACHE"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run outcome-blind locator-role regression
        shell: bash
        run: python3 production_regression/test_omossp_c21_locator_role.py
