name: OMOSSP C13 Batch2 production shard

on:
  workflow_dispatch:
    inputs:
      shard:
        description: "Frozen Batch-2 shard (1..4)"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"

permissions:
  contents: read

jobs:
  c13-batch2-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: FREE-ONLY hard gate
        shell: bash
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          test "$REPO_VISIBILITY" = "public" || {
            echo "FREE_ONLY_GATE=FAIL__REPOSITORY_NOT_PUBLIC"
            exit 96
          }
          echo "FREE_ONLY_GATE=PASS__PUBLIC_REPO__STANDARD_UBUNTU_RUNNER__NO_ARTIFACT_CACHE"

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run frozen Batch2 shard
        env:
          OMOSSP_BATCH_FILE: production_batches/omossp_c13_batch2.json
          OMOSSP_SHARD: ${{ inputs.shard }}
        run: python omossp_c13_production_worker.py

      - name: Emit replayable Batch2 shard result
        shell: bash
        env:
          SHARD: ${{ inputs.shard }}
        run: |
          echo "===== OMOSSP_C13_CANONICAL_SHA256 ====="
          cat "omossp_c13_output/c13_batch2_shard${SHARD}.sha256"
          echo "===== OMOSSP_C13_JSON_BEGIN ====="
          cat "omossp_c13_output/c13_batch2_shard${SHARD}.json"
          echo "===== OMOSSP_C13_JSON_END ====="
