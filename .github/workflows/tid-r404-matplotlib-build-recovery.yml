name: TID R404 Matplotlib Native Test Build-Recovery (same task and arms)
on:
  push:
    branches: [tid-r404-two-official-test-arm-20261112]
    paths: [".github/workflows/tid-r404-matplotlib-build-recovery.yml"]
permissions:
  contents: read
jobs:
  bounded_matplotlib_recovery:
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, agent, gold]
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      TARGET: matplotlib
      ARM: ${{ matrix.arm }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install same pinned source reader
        run: python -m pip install --quiet --disable-pip-version-check pyarrow==21.0.0
      - name: Reattempt fixed original native test with upstream supported system FreeType build
        run: python research/tid_r404_one_arm.py
      - name: Archive statuses and command evidence without patches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tid-r404-mpl-recovery-${{ matrix.arm }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
