name: AEF SEC 2018 Raw Acquisition R1

on:
  push:
    paths:
      - '.github/workflows/aef-sec-2018-raw-acquisition-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - name: Validate protected SEC identification
        shell: bash
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo 'SEC_USER_AGENT secret is missing; aborting before network access.' >&2
            exit 2
          fi

      - name: Download official SEC 2018 quarterly master indexes
        shell: python
        run: |
          import os, json, hashlib, time, urllib.request, datetime, pathlib
          ua = os.environ['SEC_USER_AGENT'].strip()
          if not ua:
              raise SystemExit('SEC_USER_AGENT is empty')
          out = pathlib.Path('sec_raw_2018')
          out.mkdir(exist_ok=True)
          rows = []
          for q in range(1, 5):
              url = f'https://www.sec.gov/Archives/edgar/full-index/2018/QTR{q}/master.idx'
              req = urllib.request.Request(url, headers={'User-Agent': ua, 'Accept-Encoding': 'identity'})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  status = getattr(resp, 'status', 200)
                  if not (200 <= status < 300):
                      raise RuntimeError(f'HTTP {status} for {url}')
                  data = resp.read()
              if not data.startswith(b'Description:') and b'CIK|Company Name|Form Type|Date Filed|Filename' not in data[:20000]:
                  raise RuntimeError(f'Unexpected master.idx content for QTR{q}')
              path = out / f'2018_QTR{q}_master.idx'
              path.write_bytes(data)
              rows.append({
                  'quarter': q,
                  'url': url,
                  'retrieved_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'http_status': status,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
                  'commit_sha': os.environ.get('GITHUB_SHA'),
                  'runner_os': os.environ.get('RUNNER_OS'),
              })
              time.sleep(1.0)
          (out / 'provenance.json').write_text(json.dumps(rows, indent=2), encoding='utf-8')
          print(json.dumps({'files': [{'quarter': r['quarter'], 'bytes': r['bytes'], 'sha256': r['sha256']} for r in rows]}, indent=2))

      - name: Upload exact raw bytes and provenance
        uses: actions/upload-artifact@v4
        with:
          name: aef-sec-2018-master-index-r1-${{ github.run_id }}
          path: sec_raw_2018/
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
