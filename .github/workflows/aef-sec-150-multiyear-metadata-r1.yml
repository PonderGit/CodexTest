name: AEF SEC 150 Multi-Year Metadata R1

on:
  push:
    paths:
      - '.github/workflows/aef-sec-150-multiyear-metadata-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - name: Validate protected SEC identification
        shell: bash
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo 'SEC_USER_AGENT secret is missing; aborting before network access.' >&2
            exit 2
          fi

      - name: Reproduce frozen sample and acquire SEC submissions metadata
        shell: python
        run: |
          import csv, io, os, json, time, random, hashlib, urllib.request, pathlib, datetime
          from collections import defaultdict

          UA=os.environ['SEC_USER_AGENT'].strip()
          YEAR=2018
          SEED=20260925
          SAMPLE_N=150
          EXPECTED_SAMPLE_LOGICAL_HASH='2e53f4940f7a79ea570b69efb44aab49f70151313747307a98fda88db8fc55c8'
          out=pathlib.Path('aef_multiyear_metadata')
          raw_sub=out/'submissions_raw'
          out.mkdir(exist_ok=True); raw_sub.mkdir(exist_ok=True)

          def get_bytes(url, host='www.sec.gov', sleep=0.20):
              time.sleep(sleep)
              req=urllib.request.Request(url, headers={'User-Agent':UA,'Accept-Encoding':'identity','Host':host})
              with urllib.request.urlopen(req, timeout=90) as r:
                  status=getattr(r,'status',200)
                  if not (200 <= status < 300): raise RuntimeError(f'HTTP {status}: {url}')
                  return r.read()

          def norm_cik(x): return str(x).strip().zfill(10)
          def stable_hash(obj):
              b=json.dumps(obj,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode('utf-8')
              return hashlib.sha256(b).hexdigest()

          all_rows=[]
          raw_index_prov=[]
          for q in range(1,5):
              url=f'https://www.sec.gov/Archives/edgar/full-index/2018/QTR{q}/master.idx'
              b=get_bytes(url)
              raw_index_prov.append({'quarter':q,'url':url,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
              start=False
              for line in b.decode('latin-1').splitlines():
                  if not start:
                      if line.startswith('CIK|'): start=True
                      continue
                  if not line.strip(): continue
                  s=line.strip()
                  if s and set(s)=={'-'}: continue
                  parts=line.split('|')
                  if len(parts)!=5: raise RuntimeError(f'Unexpected master row: {line[:160]}')
                  cik,company,form,filed,filename=parts
                  all_rows.append({'cik':norm_cik(cik),'company_name':company.strip(),'form':form.strip(),'filed':filed.strip(),'filename':filename.strip()})

          exact=[r for r in all_rows if r['form']=='10-K' and r['filed'].startswith('2018-')]
          amendments=[r for r in all_rows if r['form']=='10-K/A' and r['filed'].startswith('2018-')]
          by=defaultdict(list); am=defaultdict(list)
          for r in exact: by[r['cik']].append(r)
          for r in amendments: am[r['cik']].append(r)
          frame=[]
          for cik in sorted(by,key=int):
              fs=sorted(by[cik],key=lambda x:(x['filed'],x['filename']))
              can=fs[-1]
              frame.append({'cik':cik,'company_name':can['company_name'],'n_exact_10k_2018':len(fs),'first_exact_10k_filed':fs[0]['filed'],'last_exact_10k_filed':fs[-1]['filed'],'canonical_display_filed':can['filed'],'canonical_display_filename':can['filename'],'n_10k_a_2018':len(am.get(cik,[]))})
          rng=random.Random(SEED)
          selected=set(rng.sample([r['cik'] for r in frame],SAMPLE_N))
          sample=[r for r in frame if r['cik'] in selected]
          sample_hash=stable_hash(sample)
          if sample_hash != EXPECTED_SAMPLE_LOGICAL_HASH:
              raise RuntimeError(f'Frozen sample hash mismatch: {sample_hash}')

          with (out/'frozen_sample_transport_selector.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=list(sample[0].keys())); w.writeheader(); w.writerows(sample)

          records=[]
          source_files=[]
          for ix,row in enumerate(sample,1):
              cik=row['cik']
              base_url=f'https://data.sec.gov/submissions/CIK{cik}.json'
              b=get_bytes(base_url,host='data.sec.gov')
              (raw_sub/f'CIK{cik}.json').write_bytes(b)
              source_files.append({'cik':cik,'url':base_url,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
              data=json.loads(b)
              chunks=[data.get('filings',{}).get('recent',{})]
              for hist in data.get('filings',{}).get('files',[]) or []:
                  name=hist.get('name')
                  if not name: continue
                  hurl=f'https://data.sec.gov/submissions/{name}'
                  hb=get_bytes(hurl,host='data.sec.gov')
                  (raw_sub/name).write_bytes(hb)
                  source_files.append({'cik':cik,'url':hurl,'bytes':len(hb),'sha256':hashlib.sha256(hb).hexdigest()})
                  chunks.append(json.loads(hb))

              seen=set()
              company=data.get('name')
              for recent in chunks:
                  accs=recent.get('accessionNumber',[]) or []
                  for i,acc in enumerate(accs):
                      if acc in seen: continue
                      seen.add(acc)
                      def at(key,default=''):
                          arr=recent.get(key,[]) or []
                          return arr[i] if i < len(arr) else default
                      form=at('form')
                      filed=at('filingDate')
                      if form not in {'10-K','10-K/A','10-Q','10-Q/A'}: continue
                      if not filed or not ('2019-01-01' <= filed <= '2025-12-31'): continue
                      acc_no_dash=str(acc).replace('-','')
                      cik_int=str(int(cik))
                      primary=at('primaryDocument')
                      primary_url=f'https://www.sec.gov/Archives/edgar/data/{cik_int}/{acc_no_dash}/{primary}' if primary else ''
                      index_url=f'https://www.sec.gov/Archives/edgar/data/{cik_int}/{acc_no_dash}/{acc}-index.html'
                      records.append({
                          'cik':cik,'company_name':company,'accession':acc,'filing_date':filed,'report_date':at('reportDate'),
                          'acceptance_datetime':at('acceptanceDateTime'),'form':form,'primary_document':primary,
                          'primary_doc_description':at('primaryDocDescription'),'file_number':at('fileNumber'),'film_number':at('filmNumber'),
                          'items':at('items'),'size':at('size'),'is_xbrl':at('isXBRL'),'is_inline_xbrl':at('isInlineXBRL'),
                          'primary_url':primary_url,'index_url':index_url
                      })

          records.sort(key=lambda r:(int(r['cik']),r['filing_date'],r['form'],r['accession']))
          fields=list(records[0].keys()) if records else []
          with (out/'filing_metadata_2019_2025.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(records)

          exact=[r for r in records if r['form'] in {'10-K','10-Q'}]
          prov={
              'created_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'commit_sha':os.environ.get('GITHUB_SHA'),
              'frozen_sample_logical_hash':sample_hash,'sample_n':len(sample),
              'raw_2018_index_provenance':raw_index_prov,
              'submission_source_files':source_files,
              'metadata_rows_all_forms':len(records),'metadata_rows_exact_primary_forms':len(exact),
              'form_counts':{form:sum(r['form']==form for r in records) for form in sorted(set(r['form'] for r in records))},
              'year_counts_exact':{str(y):sum(r['form'] in {'10-K','10-Q'} and r['filing_date'].startswith(str(y)) for r in records) for y in range(2019,2026)},
              'issuers_with_any_exact_2019_2025':len(set(r['cik'] for r in exact)),
          }
          (out/'metadata_provenance.json').write_text(json.dumps(prov,indent=2),encoding='utf-8')
          print(json.dumps({k:prov[k] for k in ['sample_n','metadata_rows_all_forms','metadata_rows_exact_primary_forms','form_counts','year_counts_exact','issuers_with_any_exact_2019_2025']},indent=2))

      - name: Upload metadata and raw submissions
        uses: actions/upload-artifact@v4
        with:
          name: aef-sec-150-multiyear-metadata-r1-${{ github.run_id }}
          path: aef_multiyear_metadata/
          if-no-files-found: error
          retention-days: 5
          compression-level: 6
