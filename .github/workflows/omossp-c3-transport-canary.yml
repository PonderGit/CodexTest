name: OMOSSP C3 transport canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-evidence-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: FREE-ONLY hard gate
        shell: bash
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          test "$REPO_VISIBILITY" = "public" || {
            echo "FREE_ONLY_GATE=FAIL__REPOSITORY_NOT_PUBLIC"
            exit 96
          }
          echo "FREE_ONLY_GATE=PASS__PUBLIC_REPO__STANDARD_UBUNTU_RUNNER__NO_ARTIFACT_CACHE"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run frozen exact-evidence transport canary
        run: python omossp_c3_transport_canary.py

      - name: Emit replayable result to workflow log
        shell: bash
        run: |
          echo "===== OMOSSP_C3_RESULT_SHA256 ====="
          cat omossp_c3_output/transport_result.sha256
          echo "===== OMOSSP_C3_RESULT_JSON_BEGIN ====="
          cat omossp_c3_output/transport_result.json
          echo "===== OMOSSP_C3_RESULT_JSON_END ====="
