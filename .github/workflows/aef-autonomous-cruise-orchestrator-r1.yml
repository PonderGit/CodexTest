name: AEF Autonomous Cruise Orchestrator R1 - Validation Only

# R3 execution hardening:
# This workflow is intentionally non-launching. Real production execution must be
# grounded in a fresh Google Drive Final Acceptance Manifest by the external
# connector-mediated executor, which updates aef_production/request_r2.json.
on:
  push:
    paths:
      - 'aef_orchestrator/trigger.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aef-autonomous-cruise-orchestrator
  cancel-in-progress: false

jobs:
  validate_non_launch_boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Enforce validation-only boundary
        shell: python
        run: |
          import json, pathlib

          root=pathlib.Path('.')
          trigger_path=root/'aef_orchestrator/trigger.json'
          accepted_path=root/'aef_orchestrator/accepted_state.json'
          out_path=root/'aef_orchestrator/orchestrator_result.json'

          trigger={'mode':'TEST_ONLY'}
          if trigger_path.exists():
              trigger=json.loads(trigger_path.read_text())

          mode=trigger.get('mode','TEST_ONLY')
          if mode != 'TEST_ONLY':
              raise SystemExit(
                  'LAUNCH is disabled in this workflow. '
                  'Production must be launched only by a fresh Drive-grounded executor '
                  'that updates aef_production/request_r2.json; the request-file push is '
                  'the sole production trigger.'
              )

          accepted_cache=None
          if accepted_path.exists():
              accepted_cache=json.loads(accepted_path.read_text())

          result={
              'schema':'AEF_ORCHESTRATOR_VALIDATION_ONLY_R1',
              'result':'TEST_PASS',
              'mode':'TEST_ONLY',
              'production_launch_permitted':False,
              'production_trigger':'PUSH_OF_AEF_PRODUCTION_REQUEST_R2_JSON_ONLY',
              'checkpoint_source_of_truth':'GOOGLE_DRIVE_LATEST_AEF_CP_FINAL_ACCEPTANCE_MANIFEST_R1',
              'accepted_state_role':'NON_AUTHORITATIVE_CACHE_ONLY',
              'accepted_state_present':accepted_cache is not None,
              'requires_fresh_drive_read_for_real_launch':True
          }
          out_path.write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))

      - name: Upload validation result
        uses: actions/upload-artifact@v4
        with:
          name: aef-orchestrator-validation-r1-${{ github.run_id }}
          path: aef_orchestrator/orchestrator_result.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
