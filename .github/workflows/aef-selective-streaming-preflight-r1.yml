name: AEF Selective Streaming Preflight R1

on:
  push:
    paths:
      - '.github/workflows/aef-selective-streaming-preflight-r1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GH_TOKEN: ${{ github.token }}
      ENUM_RUN_ID: "37043849127"
      ENUM_ARTIFACT: "aef-census-metadata-enumeration-r1-37043849127"
      EXPECTED_PRIMARY_SHA256: "81943987487538619adbeb95ee26ed61dadc5fc638d61e6c577a4e2be06371b1"
      EXPECTED_CIK_HASH: "440f863ad13efe683e512d38dc4464e9370d703e1428b08e287faa3b4d4b5542"
      EXPECTED_EXTRACTOR_SHA256: "955c17cfccb43b77172309827cc279a8453c93a95942a5171344586a09ef07ed"
      EXPECTED_RETRIEVAL_SHA256: "5ed124ec9b96a827db262b0483be4f2ed4217c2321976fb948108e571b3c8509"
    steps:
      - uses: actions/checkout@v4

      - name: Validate protected identifiers and frozen code hashes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SEC_USER_AGENT" || { echo "SEC_USER_AGENT missing" >&2; exit 2; }
          test -n "$GH_TOKEN" || { echo "GH_TOKEN missing" >&2; exit 2; }
          echo "$EXPECTED_EXTRACTOR_SHA256  aef_selective_preflight/R6_SEC_150_Item9A_Item4_Extractor_R4.py" | sha256sum -c -
          echo "$EXPECTED_RETRIEVAL_SHA256  aef_selective_preflight/R6_SEC_150_Retrieval_Screen_FromCache_R3.py" | sha256sum -c -

      - name: Download verified census metadata artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p meta_in
          gh run download "$ENUM_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ENUM_ARTIFACT" --dir meta_in
          test -f meta_in/SEC_6255_Census_Primary_10K10Q_Metadata_2018_2025_R1.csv

      - name: Prepare Python dependency
        shell: bash
        run: python -m pip install --quiet pandas

      - name: Execute bounded selective-streaming production preflight
        shell: python
        run: |
          import csv, gzip, hashlib, importlib.util, io, json, os, pathlib, random, shutil, tarfile, time, urllib.error, urllib.parse, urllib.request, zipfile
          from collections import Counter
          from datetime import datetime, timezone

          ROOT=pathlib.Path('.')
          OUT=ROOT/'preflight_out'; OUT.mkdir(exist_ok=True)
          TMP=ROOT/'preflight_tmp'; TMP.mkdir(exist_ok=True)
          meta=ROOT/'meta_in/SEC_6255_Census_Primary_10K10Q_Metadata_2018_2025_R1.csv'

          def sha_bytes(b): return hashlib.sha256(b).hexdigest()
          def sha_file(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for chunk in iter(lambda:f.read(1048576),b''): h.update(chunk)
              return h.hexdigest()

          got=sha_file(meta)
          if got != os.environ['EXPECTED_PRIMARY_SHA256']:
              raise RuntimeError(f'Primary manifest hash mismatch: {got}')

          rows=list(csv.DictReader(meta.open(encoding='utf-8')))
          if len(rows)!=151931:
              raise RuntimeError(f'Primary row count mismatch: {len(rows)}')
          ciks=sorted({r['cik'].strip().zfill(10) for r in rows}, key=int)
          cik_hash=hashlib.sha256((''.join(c+'\n' for c in ciks)).encode()).hexdigest()
          if len(ciks)!=6255 or cik_hash!=os.environ['EXPECTED_CIK_HASH']:
              raise RuntimeError(f'Cohort identity mismatch n={len(ciks)} hash={cik_hash}')

          def load_module(name,path):
              spec=importlib.util.spec_from_file_location(name,path)
              mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); return mod
          ext=load_module('frozen_extractor','aef_selective_preflight/R6_SEC_150_Item9A_Item4_Extractor_R4.py')
          ret=load_module('frozen_retrieval','aef_selective_preflight/R6_SEC_150_Retrieval_Screen_FromCache_R3.py')

          if sha_file('aef_selective_preflight/R6_SEC_150_Item9A_Item4_Extractor_R4.py') != os.environ['EXPECTED_EXTRACTOR_SHA256']:
              raise RuntimeError('Extractor authority hash mismatch after import')
          if sha_file('aef_selective_preflight/R6_SEC_150_Retrieval_Screen_FromCache_R3.py') != os.environ['EXPECTED_RETRIEVAL_SHA256']:
              raise RuntimeError('Retrieval authority hash mismatch after import')

          selected=[]
          for year in range(2018,2026):
              for form in ('10-K','10-Q'):
                  pool=sorted([r for r in rows if r['form']==form and r['filing_date'].startswith(f'{year}-')],
                              key=lambda r:(r['cik'],r['filing_date'],r['accession_number']))
                  rng=random.Random(20261003 + year*10 + (1 if form=='10-Q' else 0))
                  idxs=sorted(rng.sample(range(len(pool)),16))
                  selected.extend(pool[i] for i in idxs)
          selected=sorted(selected,key=lambda r:(r['filing_date'],r['form'],r['cik'],r['accession_number']))
          if len(selected)!=256: raise RuntimeError(f'Selection n={len(selected)}')

          ua=os.environ['SEC_USER_AGENT'].strip()
          def fetch_adaptive(url):
              attempt=0; delay=1.0
              while True:
                  attempt += 1
                  req=urllib.request.Request(url,headers={
                      'User-Agent':ua,'Accept-Encoding':'identity','Host':'www.sec.gov'
                  })
                  try:
                      with urllib.request.urlopen(req,timeout=90) as resp:
                          data=resp.read(); status=getattr(resp,'status',200)
                          if not (200 <= status < 300): raise RuntimeError(f'HTTP {status}')
                          return data,status,attempt
                  except urllib.error.HTTPError as e:
                      retryable=(e.code==429 or 500 <= e.code < 600)
                      if (not retryable) or attempt>=5: raise
                      ra=e.headers.get('Retry-After')
                      wait=float(ra) if ra and ra.isdigit() else delay
                      time.sleep(min(max(wait,1.0),30.0)); delay=min(delay*2,30.0)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt>=5: raise
                      time.sleep(delay); delay=min(delay*2,30.0)

          prov=[]; derived=[]; retention=[]; failures=[]
          transient_path=OUT/'AEF_R37_Preflight_Transient_All_Raw_R1.tar.gz'
          retained_path=OUT/'AEF_R37_Preflight_Retained_Raw_R1.tar.gz'
          t_all=tarfile.open(transient_path,'w:gz',compresslevel=6)
          t_keep=tarfile.open(retained_path,'w:gz',compresslevel=6)
          try:
              for i,r in enumerate(selected,1):
                  cik=r['cik'].strip().zfill(10)
                  acc=r['accession_number'].strip()
                  primary=r['primary_document'].strip()
                  acc_clean=acc.replace('-','')
                  url=f'https://www.sec.gov/Archives/edgar/data/{int(cik)}/{acc_clean}/{urllib.parse.quote(primary,safe="._-")}'
                  tmp=TMP/f'{i:04d}.raw'
                  try:
                      data,status,attempts=fetch_adaptive(url)
                      tmp.write_bytes(data)
                      raw_sha=sha_bytes(data)
                      safe=pathlib.PurePosixPath(primary).name.replace('/','_')
                      tar_name=f'{cik}__{acc}__{safe}'
                      ti=tarfile.TarInfo(tar_name); ti.size=len(data); ti.mtime=0; ti.mode=0o644
                      t_all.addfile(ti,io.BytesIO(data))

                      text=ext.html_text(tmp)
                      section,section_status=ext.extract(text,r['form'])
                      hit,components=ret.screen(section,section_status,r['form'])

                      if section_status not in ret.USABLE:
                          retention_class='HOLD_UNRESOLVED_EXTRACTION'
                          release_eligibility='NOT_ELIGIBLE'
                      elif hit:
                          retention_class='HOLD_CANDIDATE'
                          release_eligibility='NOT_ELIGIBLE'
                      else:
                          retention_class='CLEAR_NOHIT_PENDING_DRIVE_READBACK'
                          release_eligibility='ELIGIBLE_ONLY_AFTER_PERMANENT_BUNDLE_DRIVE_READBACK'

                      if retention_class.startswith('HOLD_'):
                          ti2=tarfile.TarInfo(tar_name); ti2.size=len(data); ti2.mtime=0; ti2.mode=0o644
                          t_keep.addfile(ti2,io.BytesIO(data))

                      sec_sha=sha_bytes(section.encode('utf-8'))
                      prov.append({
                          'selection_index':i,'cik':cik,'accession_number':acc,'form':r['form'],
                          'filing_date':r['filing_date'],'report_date':r.get('report_date',''),
                          'primary_document':primary,'source_url':url,'retrieval_utc':datetime.now(timezone.utc).isoformat(),
                          'http_status':status,'attempts':attempts,'raw_bytes':len(data),'raw_sha256':raw_sha,
                          'extractor_sha256':os.environ['EXPECTED_EXTRACTOR_SHA256'],
                          'retrieval_rule_sha256':os.environ['EXPECTED_RETRIEVAL_SHA256'],
                          'section_status':section_status,'section_len':len(section),'section_sha256':sec_sha,
                          'candidate_retrieval_hit':int(hit),'retrieval_rule_components':';'.join(components),
                          'retention_class':retention_class,'release_eligibility':release_eligibility
                      })
                      derived.append({
                          'cik':cik,'accession_number':acc,'form':r['form'],'filing_date':r['filing_date'],
                          'section_status':section_status,'section_sha256':sec_sha,'section_text':section,
                          'candidate_retrieval_hit':int(hit),'retrieval_rule_components':components,
                          'retention_class':retention_class
                      })
                      retention.append({
                          'cik':cik,'accession_number':acc,'form':r['form'],
                          'retention_class':retention_class,'release_eligibility':release_eligibility,
                          'raw_sha256':raw_sha,'section_sha256':sec_sha
                      })
                  except Exception as e:
                      failures.append({**r,'source_url':url,'error':type(e).__name__+': '+str(e)[:500]})
                  finally:
                      try: tmp.unlink(missing_ok=True)
                      except Exception: pass
                  time.sleep(0.20)
          finally:
              t_all.close(); t_keep.close()

          prov_path=OUT/'AEF_R37_Preflight_Provenance_R1.csv'
          fields=list(prov[0].keys()) if prov else ['cik']
          with prov_path.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(prov)

          ret_path=OUT/'AEF_R37_Preflight_Retention_Ledger_R1.csv'
          rfields=list(retention[0].keys()) if retention else ['cik']
          with ret_path.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=rfields); w.writeheader(); w.writerows(retention)

          der_path=OUT/'AEF_R37_Preflight_Derived_Evidence_R1.jsonl.gz'
          with gzip.open(der_path,'wt',encoding='utf-8') as f:
              for x in derived: f.write(json.dumps(x,ensure_ascii=False)+'\n')

          fail_path=OUT/'AEF_R37_Preflight_Failures_R1.csv'
          ffields=sorted({k for x in failures for k in x}) if failures else ['cik','accession_number','form','error']
          with fail_path.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=ffields,extrasaction='ignore'); w.writeheader(); w.writerows(failures)

          counts=Counter(x['retention_class'] for x in retention)
          statuses=Counter(x['section_status'] for x in prov)
          with tarfile.open(transient_path,'r:gz') as tf: transient_members=len(tf.getmembers())
          with tarfile.open(retained_path,'r:gz') as tf: retained_members=len(tf.getmembers())

          summary={
              'stage':'SELECTIVE_STREAMING_ACQUISITION_EXECUTION_PREFLIGHT_R1',
              'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
              'commit_sha':os.environ.get('GITHUB_SHA'),
              'completed_at_utc':datetime.now(timezone.utc).isoformat(),
              'manifest_sha256':got,'cohort_n':len(ciks),'cohort_cik_hash':cik_hash,
              'selected_n':len(selected),'success_n':len(prov),'failure_n':len(failures),
              'selection_design':'2018-2025 x 10-K/10-Q x 16 deterministic per cell',
              'sec_pacing_seconds':0.20,'max_nominal_request_rate_per_single_job':5.0,
              'extractor_sha256':os.environ['EXPECTED_EXTRACTOR_SHA256'],
              'retrieval_rule_sha256':os.environ['EXPECTED_RETRIEVAL_SHA256'],
              'retention_counts':dict(counts),'section_status_counts':dict(statuses),
              'transient_raw_archive_members':transient_members,
              'retained_raw_archive_members':retained_members,
              'permanent_provenance_sha256':sha_file(prov_path),
              'derived_evidence_sha256':sha_file(der_path),
              'retention_ledger_sha256':sha_file(ret_path),
              'transient_raw_archive_sha256':sha_file(transient_path),
              'retained_raw_archive_sha256':sha_file(retained_path),
              'transient_raw_release_at_workflow_stage':'PROHIBITED_PENDING_DRIVE_PERSISTENCE_AND_READBACK',
              'retrieval_hit_is_not_treatment':True,
              'unusable_extraction_is_not_negative':True,
              'branch_coverage_clear_nohit':counts.get('CLEAR_NOHIT_PENDING_DRIVE_READBACK',0)>0,
              'branch_coverage_hold':(counts.get('HOLD_CANDIDATE',0)+counts.get('HOLD_UNRESOLVED_EXTRACTION',0))>0,
          }
          summary['complete']=(
              len(prov)==len(selected) and not failures
              and transient_members==len(prov)
              and retained_members==(counts.get('HOLD_CANDIDATE',0)+counts.get('HOLD_UNRESOLVED_EXTRACTION',0))
              and summary['branch_coverage_clear_nohit'] and summary['branch_coverage_hold']
          )
          summary_path=OUT/'AEF_R37_Preflight_Summary_R1.json'
          summary_path.write_text(json.dumps(summary,indent=2),encoding='utf-8')

          code_hash_path=OUT/'AEF_R37_Preflight_Code_Hashes_R1.json'
          code_hash_path.write_text(json.dumps({
              'extractor_file':'R6_SEC_150_Item9A_Item4_Extractor_R4.py',
              'extractor_sha256':os.environ['EXPECTED_EXTRACTOR_SHA256'],
              'retrieval_file':'R6_SEC_150_Retrieval_Screen_FromCache_R3.py',
              'retrieval_sha256':os.environ['EXPECTED_RETRIEVAL_SHA256']
          },indent=2),encoding='utf-8')

          permanent=OUT/'AEF_R37_Preflight_Permanent_Bundle_R1.zip'
          with zipfile.ZipFile(permanent,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in [prov_path,ret_path,der_path,fail_path,retained_path,summary_path,code_hash_path]:
                  z.write(p,p.name)
              z.write('aef_selective_preflight/R6_SEC_150_Item9A_Item4_Extractor_R4.py','frozen_code/R6_SEC_150_Item9A_Item4_Extractor_R4.py')
              z.write('aef_selective_preflight/R6_SEC_150_Retrieval_Screen_FromCache_R3.py','frozen_code/R6_SEC_150_Retrieval_Screen_FromCache_R3.py')

          summary['permanent_bundle_sha256']=sha_file(permanent)
          summary['permanent_bundle_bytes']=permanent.stat().st_size
          summary['transient_raw_archive_bytes']=transient_path.stat().st_size
          summary_path.write_text(json.dumps(summary,indent=2),encoding='utf-8')
          with zipfile.ZipFile(permanent,'a',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              z.writestr('AEF_R37_Preflight_Summary_Final_R1.json',json.dumps(summary,indent=2))

          print(json.dumps(summary,indent=2))
          if not summary['complete']:
              raise RuntimeError('Selective-streaming preflight acceptance test failed')

      - name: Upload preflight artifact with transient and permanent layers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aef-selective-streaming-preflight-r1-${{ github.run_id }}
          path: |
            preflight_out/AEF_R37_Preflight_Permanent_Bundle_R1.zip
            preflight_out/AEF_R37_Preflight_Transient_All_Raw_R1.tar.gz
            preflight_out/AEF_R37_Preflight_Summary_R1.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
