name: OMOSSP C5 evidence progression

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c5-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: FREE-ONLY hard gate
        shell: bash
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          test "$REPO_VISIBILITY" = "public" || {
            echo "FREE_ONLY_GATE=FAIL__REPOSITORY_NOT_PUBLIC"
            exit 96
          }
          echo "FREE_ONLY_GATE=PASS__PUBLIC_REPO__STANDARD_UBUNTU_RUNNER__NO_ARTIFACT_CACHE"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run frozen C5 evidence progression canary
        run: python omossp_c5_progress.py

      - name: Emit replayable C5 result to log
        shell: bash
        run: |
          echo "===== OMOSSP_C5_CANONICAL_SHA256 ====="
          cat omossp_c5_output/c5_canonical.sha256
          echo "===== OMOSSP_C5_JSON_BEGIN ====="
          cat omossp_c5_output/c5_progression.json
          echo "===== OMOSSP_C5_JSON_END ====="
