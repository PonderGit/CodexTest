name: OMOSSP C6 generic pilot

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c6-generic-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: FREE-ONLY hard gate
        shell: bash
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          test "$REPO_VISIBILITY" = "public" || {
            echo "FREE_ONLY_GATE=FAIL__REPOSITORY_NOT_PUBLIC"
            exit 96
          }
          echo "FREE_ONLY_GATE=PASS__PUBLIC_REPO__STANDARD_UBUNTU_RUNNER__NO_ARTIFACT_CACHE"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run C6 generic evidence-progression pilot
        run: python omossp_c6_generic_worker.py
      - name: Emit replayable C6 result
        shell: bash
        run: |
          echo "===== OMOSSP_C6_CANONICAL_SHA256 ====="
          cat omossp_c6_output/c6_pilot_result.sha256
          echo "===== OMOSSP_C6_JSON_BEGIN ====="
          cat omossp_c6_output/c6_pilot_result.json
          echo "===== OMOSSP_C6_JSON_END ====="
